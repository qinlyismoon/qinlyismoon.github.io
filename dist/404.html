<!doctype html>

  <head>
    <meta charset="UTF-8" />

    <title>Longyue Qin</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      /* Apply saved mode + accent before the loader paints — same
         vocabulary as src/lib/settings.js (themeMode, accent page grounds). */
      (function () {
        var PAGE_BG = {
          forest: { light: "#fafafa", dark: "#161816" },
          ink: { light: "#fafafa", dark: "#15171a" },
          clay: { light: "#fafafa", dark: "#1a1716" },
          plum: { light: "#fafafa", dark: "#18161a" },
          ochre: { light: "#fafafa", dark: "#1a1814" },
        };
        var TEXT = { light: "#20201f", dark: "#f2f2f0" };
        var root = document.documentElement;

        function apply(theme, accent) {
          var isDark = theme === "dark";
          var grounds = PAGE_BG[accent] || PAGE_BG.forest;
          var pageBg = isDark ? grounds.dark : grounds.light;
          root.dataset.theme = theme;
          root.dataset.accent = accent;
          root.style.colorScheme = theme;
          root.style.setProperty("--color-background", pageBg);
          root.style.setProperty("--loader-background", pageBg);
          root.style.setProperty("--loader-text", isDark ? TEXT.dark : TEXT.light);
          root.style.setProperty(
            "--loader-logo-filter",
            isDark ? "invert(1)" : "none",
          );
        }

        try {
          var saved = JSON.parse(
            localStorage.getItem("phoebe-site-settings") || "null",
          );
          var mode =
            saved && ["light", "dark", "system"].indexOf(saved.themeMode) !== -1
              ? saved.themeMode
              : saved && saved.isDarkMode
                ? "dark"
                : "light";
          var isDark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var accent =
            saved && PAGE_BG[saved.accent] ? saved.accent : "forest";
          root.dataset.typeVoice =
            saved &&
            ["serif", "geometric"].indexOf(saved.typeVoice) !== -1
              ? saved.typeVoice
              : "geometric";
          apply(isDark ? "dark" : "light", accent);
        } catch (e) {
          root.dataset.typeVoice = "geometric";
          apply("light", "forest");
        }
      })();
    </script>
    <style>
      :root {
        --loader-background: #fafafa;
        --loader-text: #20201f;
        --loader-logo-filter: none;
        --color-background: #fafafa;
        --color-surface: #efefef;
      }

      #site-loader {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: grid;
        place-content: center;
        gap: 16px;
        color: var(--loader-text);
        background: var(--loader-background);
        font: 400 16px/1.5 "Outfit", "Zalando Sans", Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0.01em;
        text-align: center;
        opacity: 1;
        transition: opacity 220ms ease;
      }

      #site-loader.is-complete {
        opacity: 0;
        pointer-events: none;
      }

      #site-loader img {
        width: 56px;
        height: auto;
        margin: 0 auto;
        object-fit: contain;
        filter: var(--loader-logo-filter);
      }

      #site-loader p {
        margin: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        #site-loader {
          transition: none;
        }
      }
    </style>
