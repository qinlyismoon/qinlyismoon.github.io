<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Longyue Qin</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      /* Apply the saved theme before the loader paints, preventing a
         light loading screen from flashing before a dark portfolio. */
      try {
        const savedSettings = JSON.parse(
          localStorage.getItem("phoebe-site-settings") || "null",
        );
        const initialTheme = savedSettings?.isDarkMode ? "dark" : "light";
        document.documentElement.dataset.theme = initialTheme;
        document.documentElement.style.colorScheme = initialTheme;
      } catch {
        document.documentElement.dataset.theme = "light";
        document.documentElement.style.colorScheme = "light";
      }
    </script>
    <style>
      :root {
        --loader-background: #f7f7f5;
        --loader-text: #20201f;
        --loader-logo-filter: none;
      }

      :root[data-theme="dark"] {
        --loader-background: #171717;
        --loader-text: #f2f2f0;
        --loader-logo-filter: invert(1);
      }

      #site-loader {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: grid;
        place-content: center;
        gap: 16px;
        color: var(--loader-text);
        background: var(--loader-background);
        font: 400 16px/1.5 "Zalando Sans", Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0.01em;
        text-align: center;
        opacity: 1;
        transition: opacity 220ms ease;
      }

      #site-loader.is-complete {
        opacity: 0;
        pointer-events: none;
      }

      #site-loader img {
        width: 56px;
        height: auto;
        margin: 0 auto;
        object-fit: contain;
        filter: var(--loader-logo-filter);
      }

      #site-loader p {
        margin: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        #site-loader {
          transition: none;
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=STIX+Two+Text:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Zalando+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="site-loader" role="status" aria-label="Loading website">
      <img src="/name-logo.png" alt="" />
      <p>Initializing workspace…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
